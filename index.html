<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>判例らくがき帳</title>
<style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#35312d;background:#f7f4e9}
*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:0 auto;padding:16px 16px 55px}
h1{font-size:1.4rem}.sheet{background:#fff;border:1px solid #ded6c7;border-radius:14px;padding:14px;box-shadow:0 8px 25px #493a2417}
img{display:block;max-width:100%;max-height:60vh;margin:auto;object-fit:contain}
nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0}
button{font-size:1rem;padding:12px;border:1px solid #aca499;border-radius:9px;background:#fff;cursor:pointer}
button:disabled{opacity:.3;cursor:default}.description{background:#fffef9;border-radius:12px;padding:16px 20px;line-height:1.85}
h2{margin:.1em 0}small{color:#666}.tip{font-size:.85rem;color:#777}
</style></head><body><main><h1>📖 判例らくがき帳</h1>
<div class="sheet"><img id="drawing" alt="判例イラスト"></div>
<nav><button id="prev">◀ 前のページ</button><span id="count"></span><button id="next">次のページ ▶</button></nav>
<section class="description"><h2 id="title"></h2><small id="category"></small><p id="story"></p><p><b>裁判所の判断：</b><span id="judgment"></span></p><p><b>試験ポイント：</b><span id="point"></span></p></section>
<p class="tip">← → キーでもページをめくれます。ページ番号はURLに保存されます。</p>
</main><script src="pages.js"></script><script>
let i=Math.max(0,Math.min(PAGES.length-1,(parseInt(location.hash.slice(1))||1)-1));
const el=id=>document.getElementById(id);
function render(){let p=PAGES[i];["title","category","story","judgment","point"].forEach(k=>el(k).textContent=p[k]);el("drawing").src=p.image;el("drawing").alt=p.title;el("count").textContent=(i+1)+" / "+PAGES.length;el("prev").disabled=i===0;el("next").disabled=i===PAGES.length-1;history.replaceState(null,"","#"+(i+1));}
el("prev").onclick=()=>{if(i>0){i--;render()}};el("next").onclick=()=>{if(i<PAGES.length-1){i++;render()}};
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")el("prev").click();if(e.key==="ArrowRight")el("next").click()});
render();
</script></body></html>
