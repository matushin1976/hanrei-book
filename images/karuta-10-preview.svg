<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="890" viewBox="0 0 1580 890"><rect width="1580" height="890" fill="#f8f3ea"/><g font-family="sans-serif" fill="#333"><g transform="translate(20 20)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#dc774a" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">宇奈月温泉事件</text><text x="146" y="216" text-anchor="middle" font-size="120">♨️</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">温泉の引湯管を撤去しろという請求が権利濫用とされた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">01</text></g><g transform="translate(332 20)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#5f8ebf" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">レペタ事件</text><text x="146" y="216" text-anchor="middle" font-size="120">📝</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">法廷でのメモ行為は憲法21条の精神に照らして尊重されるが、憲法上の権利とはされない。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">02</text></g><g transform="translate(644 20)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#62a37b" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">東大ポポロ事件</text><text x="146" y="216" text-anchor="middle" font-size="120">🎭</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">大学の演劇会に潜入した私服警察官をめぐり大学の自治が争われた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">03</text></g><g transform="translate(956 20)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#c39844" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">津地鎮祭事件</text><text x="146" y="216" text-anchor="middle" font-size="120">⛩️</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">市の体育館建設の地鎮祭への公金支出が政教分離に反するかが争われた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">04</text></g><g transform="translate(1268 20)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#a379ae" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">薬事法距離制限事件</text><text x="146" y="216" text-anchor="middle" font-size="120">💊</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">薬局開設の距離制限が職業選択の自由に反し違憲とされた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">05</text></g><g transform="translate(20 445)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#dc774a" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">朝日訴訟</text><text x="146" y="216" text-anchor="middle" font-size="120">🏥</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">結核療養中の生活保護受給者が生活保護基準などを争った。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">06</text></g><g transform="translate(332 445)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#5f8ebf" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">三菱樹脂事件</text><text x="146" y="216" text-anchor="middle" font-size="120">🏭</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">採用と学生運動歴、私人間における人権保障が争われた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">07</text></g><g transform="translate(644 445)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#62a37b" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">猿払事件</text><text x="146" y="216" text-anchor="middle" font-size="120">📮</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">国家公務員の政治的行為の禁止をめぐる事件。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">08</text></g><g transform="translate(956 445)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#c39844" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">在外邦人選挙権訴訟</text><text x="146" y="216" text-anchor="middle" font-size="120">🗳️</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">海外在住の日本人への国政選挙の投票制限が違憲とされた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">09</text></g><g transform="translate(1268 445)"><rect width="292" height="403" rx="13" fill="#fffdf9" stroke="#a379ae" stroke-width="7"/><text x="146" y="47" text-anchor="middle" font-size="24" font-weight="bold">尊属殺重罰規定違憲判決</text><text x="146" y="216" text-anchor="middle" font-size="120">⚖️</text><foreignObject x="18" y="280" width="256" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;text-align:center;line-height:1.5;color:#444">尊属殺を特別に重く処罰する旧刑法200条は違憲とされた。</div></foreignObject><text x="146" y="387" text-anchor="middle" font-size="16" fill="#777">10</text></g></g></svg>